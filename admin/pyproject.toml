[project]
name = "seemyfamily-admin"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2.8",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.1",
    "dj-database-url>=2.3",
    "pillow>=11.0",
]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated by makemigrations; hand-edits get overwritten.
"*/migrations/*.py" = ["RUF012", "I001"]
